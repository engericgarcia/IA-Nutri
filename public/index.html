<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IA Nutri</title>
  <meta name="description" content="Tire uma foto do prato e descubra as calorias" />
  <meta name="theme-color" content="#16a34a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="IA Nutri" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <h1>🥗 IA Nutri</h1>
    <button id="profileBtn" class="ghost" aria-label="Meu perfil">👤 Perfil</button>
  </header>

  <main>
    <section class="card today">
      <div class="today-head">
        <span>Hoje</span>
        <strong><span id="todayKcal">0</span> / <span id="goalKcal">2000</span> kcal</strong>
      </div>
      <div class="bar"><div id="todayBar"></div></div>
      <div class="macros-mini" id="todayMacros"></div>
      <div id="balanceBox"></div>
      <div id="bodyBox" class="body-box"></div>
    </section>

    <section class="card capture">
      <label class="photo-drop" id="photoDrop">
        <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />
        <img id="preview" alt="" hidden />
        <span id="photoHint">📷 Tirar foto do prato</span>
      </label>
      <button id="galleryBtn" class="ghost small">ou escolher da galeria</button>
      <input id="galleryInput" type="file" accept="image/*" hidden />
      <textarea id="desc" rows="2" placeholder="Opcional: detalhes (ex: 150g de frango, arroz integral, sem óleo)"></textarea>
      <button id="analyzeBtn" class="primary" disabled>Calcular calorias</button>
    </section>

    <section id="result" class="card result" hidden></section>

    <section class="card history">
      <div class="history-head">
        <h2>Histórico</h2>
        <div class="tabs" role="tablist">
          <button role="tab" data-view="day" aria-selected="true">Dia</button>
          <button role="tab" data-view="week" aria-selected="false">Semana</button>
          <button role="tab" data-view="month" aria-selected="false">Mês</button>
        </div>
      </div>
      <div class="period-nav">
        <button id="prevPeriod" class="ghost icon" aria-label="Período anterior">‹</button>
        <span id="periodLabel"></span>
        <button id="nextPeriod" class="ghost icon" aria-label="Próximo período">›</button>
      </div>
      <div id="historyBody"></div>
    </section>

    <p class="muted disclaimer">Valores estimados por IA a partir da foto (base TACO/TBCA/USDA). Use como referência, não como substituto de nutricionista.</p>
  </main>

  <dialog id="profileDialog">
    <form method="dialog" id="profileForm">
      <h2>Meu perfil</h2>
      <div class="form-grid">
        <label>Sexo
          <select name="sexo" required>
            <option value="m">Masculino</option>
            <option value="f">Feminino</option>
          </select>
        </label>
        <label>Idade<input name="idade" type="number" min="14" max="100" inputmode="numeric" placeholder="anos" required /></label>
        <label>Peso (kg)<input name="peso" type="number" min="30" max="300" step="0.1" inputmode="decimal" placeholder="ex: 82,5" required /></label>
        <label>Altura (cm)<input name="altura" type="number" min="120" max="230" inputmode="numeric" placeholder="ex: 175" required /></label>
        <label class="full">Nível de atividade
          <select name="atividade">
            <option value="1.2">Sedentário (pouco ou nenhum exercício)</option>
            <option value="1.375">Leve (treina 1–3x por semana)</option>
            <option value="1.55" selected>Moderado (treina 3–5x por semana)</option>
            <option value="1.725">Intenso (treina 6–7x por semana)</option>
            <option value="1.9">Muito intenso (treino pesado + trabalho físico)</option>
          </select>
        </label>
        <label class="full">Objetivo
          <select name="objetivo">
            <option value="perder" selected>Perder gordura (déficit de ~20%)</option>
            <option value="manter">Manter o peso</option>
            <option value="ganhar">Ganhar massa (superávit de ~10%)</option>
          </select>
        </label>
        <label class="full">Meta diária personalizada (opcional)
          <input name="metaManual" type="number" min="800" max="6000" step="50" inputmode="numeric" placeholder="deixe vazio para usar a recomendada" />
        </label>
      </div>
      <div id="profilePreview" class="profile-preview"></div>
      <menu><button value="cancel" formnovalidate class="ghost">Cancelar</button><button value="ok" class="primary">Salvar</button></menu>
    </form>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
